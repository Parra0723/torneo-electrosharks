<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" data-own>
<meta name="viewport" content="width=device-width, initial-scale=1" data-own>
<title data-own>Inscripciones ElectroSharks</title>
<meta name="theme-color" content="#001E96" data-own>
<link rel="icon" type="image/png" sizes="32x32" href="assets/icono-32.png" data-own>
<link rel="apple-touch-icon" href="assets/icono-180.png" data-own>
<meta name="apple-mobile-web-app-title" content="Inscripciones" data-own>
<link rel="preconnect" href="https://fonts.googleapis.com" data-own>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin data-own>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" data-own>
<style data-own>
/* VOICE friendly school-event desk; teens and helpers using it for the first time
   IDEA a football sticker album in ElectroSharks team colours: every player is a sticker, every duo a pair
   PICTURE the sticker cards themselves under a team-blue scoreboard with the ElectroSharks logo
   COLOUR ElectroSharks palette: blue #001E96, crimson #D20043, light grey #E8E8E5, black, white; green only for paid
   TYPE Baloo 2 for headings and numbers + Nunito for text
   LAYOUT laptop: title + scoreboard, then the working view; phone: bottom menu, one column of stickers */
:root{color-scheme:light dark;--blue:#001E96;--crim:#D20043;--grey:#E8E8E5;--band:light-dark(#001E96,#001478);--bg:light-dark(#f4f4f2,#060b22);--card:light-dark(#fff,#0d1533);--ink:light-dark(#0e1120,#eceef6);--mu:light-dark(#535a70,#a7aec8);--line:light-dark(#dadbe0,#27305a);--g:light-dark(#001E96,#3b5cff);--gd:light-dark(#00105c,#000a3d);--g2:light-dark(#e7eafa,#111d52);--y:#D20043;--y2:light-dark(#ececE9,#1a2148);--r:light-dark(#D20043,#ff5c8d);--rb:light-dark(#fde5ed,#3d0a1f);--ok:light-dark(#0b7a40,#5bd893);--okb:light-dark(#dcf3e4,#103a26);--am:light-dark(#8a5c00,#ffd166);--amb:light-dark(#fff1c4,#382e0e);--sh:0 1px 0 light-dark(#dadbe0,#27305a),0 8px 20px -12px light-dark(#001E9666,#000)}
:root[data-theme=light]{color-scheme:light}
:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
[hidden]{display:none!important}
html{scroll-padding-top:72px}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 Nunito,system-ui,sans-serif;overflow-x:clip}
.wrap{max-width:1180px;margin:0 auto}
.band{padding:clamp(18px,3vw,36px) max(4vw,16px)}
h1,h2,h3,h4{font-family:"Baloo 2",Nunito,sans-serif;font-weight:800;letter-spacing:-.01em;line-height:1.05;margin:0;text-wrap:balance}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.av{--h:#0f8a4a;display:inline-grid;place-items:center;flex:none;width:44px;height:44px;border-radius:50%;background:var(--h);color:#fff;font:800 17px/1 "Baloo 2",sans-serif;box-shadow:0 0 0 3px var(--card),0 0 0 4px color-mix(in srgb,var(--h) 35%,transparent)}
.av.sm{width:30px;height:30px;font-size:13px;box-shadow:0 0 0 2px var(--card)}
.av.lg{width:64px;height:64px;font-size:26px}
.tic{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:12px;background:var(--g2);color:var(--g);flex:none}
.tic .ic{width:24px;height:24px}
.top{background:var(--band);color:#fff;padding-bottom:20px}
.topg{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:16px 28px;align-items:end}
.ttl{display:grid;grid-template-columns:auto auto;gap:0 14px;align-items:center;justify-content:start}
.ttl .logo{grid-row:span 3;background:#fff;border-radius:20px;padding:8px 12px;box-shadow:0 6px 0 var(--gd);display:block}
.ttl .logo img{display:block;height:92px;width:auto}
.ttl h1{font-size:clamp(36px,4.6vw,52px)}
.ttl p{margin:0;color:#dde3ff}
.sync{font-size:14px}
.score{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.k{padding:12px 16px;border-radius:18px;background:var(--gd);display:flex;flex-direction:column}
.k span{font-size:15px;color:#d3dbff;line-height:1.25}
.k b{font:800 clamp(34px,5vw,56px)/1.05 "Baloo 2",sans-serif;color:#fff;white-space:nowrap;font-variant-numeric:tabular-nums}
.k b.red{color:#ff7fa8}
.k b.wh{color:#fff}
.k small{font-size:14px;color:#d3dbff}
.cupos{grid-column:1/-1;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:8px 24px}
.cu{display:grid;grid-template-columns:auto auto minmax(0,1fr) auto;gap:10px;align-items:center;font-size:15px;font-weight:700}
.cu .ic{width:18px;height:18px}
.cu .tr{height:12px;background:#ffffff2b;border-radius:6px;overflow:hidden}
.cu .tr i{display:block;height:100%;background:var(--grey);border-radius:6px}
.cu .v{white-space:nowrap;font-variant-numeric:tabular-nums;color:#e3e8ff;font-weight:600}
.tabs{position:sticky;top:0;z-index:10;background:var(--gd);padding:0 max(4vw,16px)}
.tabs .wrap{display:flex;gap:6px;padding:6px 0}
.tabs a{display:flex;align-items:center;gap:8px;color:#d8dfff;text-decoration:none;font:700 18px "Baloo 2",sans-serif;padding:8px 18px;border-radius:999px;min-height:48px}
.tabs a[aria-current=page]{color:#fff;background:var(--crim)}
.tabs a:hover:not([aria-current]){background:#ffffff14;color:#fff}
.tabs a:focus-visible{outline:3px solid #fff;outline-offset:2px}
.panel{background:var(--card);border-radius:22px;padding:20px 22px;margin:0 0 16px;box-shadow:var(--sh)}
label,.lbl{display:block;font-size:16px;font-weight:800;color:var(--ink);margin:18px 0 6px}
.lbl:first-child,label:first-child{margin-top:4px}
.mu{color:var(--mu);font-weight:600}
input,select,textarea{font:17px Nunito,sans-serif;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:14px;padding:10px 14px;width:100%;min-height:50px}
input:hover,select:hover,textarea:hover{border-color:color-mix(in srgb,var(--g) 40%,var(--line))}
textarea{min-height:80px}
input::placeholder{color:color-mix(in srgb,var(--mu) 80%,transparent)}
:focus-visible{outline:3px solid color-mix(in srgb,var(--g) 70%,var(--crim));outline-offset:2px}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 14px}
.telg{display:grid;grid-template-columns:minmax(8em,40%) minmax(0,1fr);gap:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:800 16px Nunito,sans-serif;min-height:50px;padding:8px 20px;border-radius:999px;border:2px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;text-decoration:none;transition:transform .12s,background .15s,border-color .15s}
.btn:hover{border-color:var(--g)}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--g);border-color:var(--g);color:#fff;box-shadow:0 4px 0 var(--gd)}
.btn.pri:active{box-shadow:0 1px 0 var(--gd);transform:translateY(3px)}
.btn.pri:hover{background:color-mix(in srgb,var(--g) 88%,#000)}
.btn.lg{min-height:58px;font-size:19px;padding:10px 26px}
.btn.sm{min-height:44px;padding:6px 16px;font-size:15px}
.btn.ghost{background:transparent}
.btn.danger{color:var(--r)}
.tiles{display:grid;gap:10px;margin:0}
.tiles.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.tiles.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.tiles.mtl{grid-template-columns:repeat(auto-fill,minmax(9.5em,1fr))}
.tile{display:flex;align-items:center;justify-content:center;gap:10px;min-height:58px;padding:10px 14px;border:2px solid var(--line);border-radius:16px;background:var(--card);color:var(--ink);font:800 16px/1.25 Nunito,sans-serif;cursor:pointer;text-align:center;transition:border-color .15s,background .15s,transform .12s}
.tile:hover{border-color:var(--g)}
.tile:active{transform:scale(.98)}
.tile.on{border-color:var(--g);background:var(--g2);box-shadow:inset 0 0 0 1px var(--g)}
.tile.on>.ic{color:#fff;background:var(--g);border-radius:50%;padding:3px;width:22px;height:22px;stroke-width:3}
.tile:disabled{opacity:.45;cursor:not-allowed}
.tile.left{justify-content:flex-start;text-align:left}
.tile small{display:block;font-weight:600;color:var(--mu);font-size:14px}
.tile .avs{display:flex;margin-right:4px}
.tile.left>span{display:flex;align-items:center;gap:12px}
.tile .avs .av+.av{margin-left:-8px}
.hint{font-size:15px;color:var(--mu);margin:6px 0 0}
.hint.good{color:var(--ok);font-weight:700}
.hint.bad,.err{color:var(--r)}
.err{font-size:16px;font-weight:800;margin:10px 0 0}
.err:empty{display:none}
.wiz{max-width:760px;margin:0 auto}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin:0 0 18px;padding:0;list-style:none;counter-reset:s}
.steps li{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;font-size:15px;font-weight:700;color:var(--mu);counter-increment:s}
.steps li::before{content:counter(s);width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);border:3px solid var(--line);font:800 18px "Baloo 2",sans-serif;color:var(--mu);position:relative;z-index:1}
.steps li+li::after{content:"";position:absolute;top:18px;right:50%;width:100%;height:4px;background:var(--line);border-radius:2px}
.steps li.on{color:var(--ink)}
.steps li.on::before{background:var(--crim);border-color:var(--crim);color:#fff}
.steps li.done::before{content:"✓";background:var(--g);border-color:var(--g);color:#fff}
.steps li.done+li::after,.steps li.done::after,.steps li.on::after{background:var(--g)}
.steps b{display:none}
.wiz h2{font-size:clamp(30px,4.2vw,40px);margin-bottom:4px}
.wiz .sub{margin:0 0 6px;color:var(--mu)}
.wnav{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.wnav .btn.pri{margin-left:auto}
.tcard{border:2px solid var(--line);border-radius:20px;margin:12px 0;overflow:hidden;background:var(--card);transition:border-color .15s}
.tcard.on{border-color:var(--g);box-shadow:0 0 0 2px color-mix(in srgb,var(--g) 25%,transparent)}
.tcard.dis{opacity:.6}
.tsel{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:14px;width:100%;padding:14px 18px;cursor:pointer}
.tsel:focus-visible{outline:3px solid var(--g);outline-offset:-4px}
.tsel b{font:800 20px/1.1 "Baloo 2",sans-serif}
.tsel small{display:block;color:var(--mu);font-size:14px;font-weight:600}
.box{width:32px;height:32px;border:3px solid var(--line);border-radius:10px;display:grid;place-items:center;flex:none;background:var(--card)}
.tcard.on .box{background:var(--g);border-color:var(--g);color:#fff}
.box .ic{stroke-width:3.4}
.price{margin-left:auto;font:800 32px/1 "Baloo 2",sans-serif;white-space:nowrap;background:var(--y2);color:var(--ink);padding:6px 12px;border-radius:12px}
.tch{padding:6px 18px 18px;border-top:2px dashed var(--line);background:color-mix(in srgb,var(--g2) 60%,var(--card))}
.tlist{display:grid;gap:8px}
.due{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:4px 12px;background:var(--y2);border-radius:18px;padding:14px 20px;margin:8px 0 4px}
.due span{font-weight:800}
.due b{font:800 50px/1 "Baloo 2",sans-serif;white-space:nowrap}
.due small{width:100%;color:var(--mu);font-size:15px}
.money{display:flex;align-items:center;border:2px solid var(--line);border-radius:14px;background:var(--bg)}
.money:focus-within{outline:3px solid color-mix(in srgb,var(--g) 70%,var(--crim));outline-offset:2px}
.money span{padding:0 4px 0 16px;font:800 24px "Baloo 2",sans-serif;color:var(--mu)}
.money input{border:0;font:800 26px Nunito,sans-serif;min-height:60px;background:transparent;outline:none}
.res{display:flex;align-items:center;gap:10px;font:800 22px/1.2 "Baloo 2",sans-serif;padding:12px 18px;border-radius:16px;margin-top:16px}
.res.r{background:var(--rb);color:var(--r)}
.res.ok{background:var(--okb);color:var(--ok)}
.fillrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.fin{text-align:center;padding:32px 20px;position:relative;overflow:hidden}
.okc{width:84px;height:84px;border-radius:50%;background:var(--g);color:#fff;display:grid;place-items:center;margin:0 auto 14px;box-shadow:0 6px 0 var(--gd);animation:pop .45s cubic-bezier(.3,1.6,.5,1) both}
.okc .ic{width:46px;height:46px;stroke-width:3}
.fin h2{font-size:clamp(30px,4.4vw,44px)}
.fin .acts{display:grid;gap:12px;max-width:440px;margin:22px auto 0}
.fin .who{display:inline-flex;align-items:center;gap:10px;background:var(--g2);border-radius:999px;padding:6px 16px 6px 6px;font-weight:700;margin:8px 0}
.conf{position:absolute;inset:0;pointer-events:none}
.conf i{position:absolute;top:-12px;width:10px;height:14px;border-radius:3px;animation:fall 1.6s ease-in both}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes fall{0%{transform:translateY(0) rotate(0);opacity:1}100%{transform:translateY(420px) rotate(540deg);opacity:0}}
.big{font:800 26px "Baloo 2",sans-serif;margin:6px 0 0}
.big.r{color:var(--r)}
.big.ok{color:var(--ok)}
.lhead{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:14px}
.lhead h2{font-size:clamp(32px,3.6vw,40px)}
.srch{position:relative}
.srch .ic{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--mu)}
.srch input{padding-left:48px;min-height:56px;font-size:18px;border-radius:999px;background:var(--card)}
.fchips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.fchip{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:6px 16px;border-radius:999px;border:2px solid var(--line);background:var(--card);font:800 15px Nunito,sans-serif;cursor:pointer;color:var(--ink)}
.fchip:hover{border-color:var(--g)}
.fchip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.fchip span{display:inline-grid;place-items:center;min-width:24px;height:24px;padding:0 6px;border-radius:999px;background:var(--g2);color:var(--ink);font-size:13px}
.fchip.on span{background:var(--crim);color:#fff}
.fchip .ic{width:18px;height:18px}
.pl{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:12px}
.pc{display:flex;flex-direction:column;background:var(--card);border-radius:20px;box-shadow:var(--sh);overflow:hidden;transition:transform .15s}
.pc:hover{transform:translateY(-2px)}
.pmain{all:unset;box-sizing:border-box;display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;align-items:center;padding:14px 16px 10px;cursor:pointer}
.pmain .av{grid-row:span 2}
.pmain:focus-visible{outline:3px solid var(--g);outline-offset:-3px;border-radius:20px}
.pn{font:800 20px/1.15 "Baloo 2",sans-serif}
.ps{font-size:14px;color:var(--mu);font-weight:600}
.pts{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.tc{display:inline-flex;align-items:center;gap:5px;font-size:14px;font-weight:700;background:var(--g2);border-radius:999px;padding:3px 10px 3px 6px}
.tc .ic{width:16px;height:16px;color:var(--g)}
.tc i{font-style:normal;color:var(--mu);font-weight:600}
.tc.solo{background:var(--y2)}
.tc.solo i{color:var(--r)}
.pr{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 16px;border-top:2px dashed var(--line);margin-top:auto}
.amt{font:800 20px "Baloo 2",sans-serif;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.amt.r{color:var(--r)}
.amt.ok{color:var(--ok)}
.amt.am{color:var(--am)}
.amt .ic{stroke-width:3}
.empty{text-align:center;color:var(--mu);padding:36px 16px}
.empty .ic{width:56px;height:56px;color:var(--g);stroke-width:1.5;margin-bottom:8px}
.help{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 16px;align-items:start;background:var(--y2);border-radius:22px;padding:18px 20px;margin-bottom:18px}
.help>.ic{width:34px;height:34px;color:var(--am)}
.help>div>b{font:800 20px "Baloo 2",sans-serif}
.help ol{margin:6px 0 12px;padding-left:22px}
.help li{margin:3px 0}
.cash{display:grid;gap:6px;margin-top:6px}
.cr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:10px 0;border-bottom:2px dashed var(--line)}
.cr b{font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.cr small{grid-column:1/-1;color:var(--mu)}
.ov{position:fixed;inset:0;z-index:20;background:#000a2ecc;display:grid;place-items:start center;overflow-y:auto;padding:24px 12px}
.sheet{background:var(--card);color:var(--ink);border-radius:26px;width:min(660px,100%);padding:0 24px 24px}
.mh{position:sticky;top:0;z-index:1;background:var(--card);display:flex;align-items:center;gap:14px;padding:18px 0 12px;border-bottom:2px dashed var(--line)}
.mh>div{flex:1}
.mh h2{font-size:30px}
.mh p{margin:2px 0 0;color:var(--mu);font-size:15px;font-weight:600}
.x{all:unset;cursor:pointer;width:48px;height:48px;display:grid;place-items:center;border-radius:50%;flex:none;background:var(--g2)}
.x:hover{background:color-mix(in srgb,var(--g2) 70%,var(--g))}
.x:focus-visible{outline:3px solid var(--g)}
.bal{border-radius:20px;padding:16px 20px;margin:16px 0;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:4px 12px}
.bal.r{background:var(--rb)}
.bal.ok{background:var(--okb)}
.bal span{font-weight:800;font-size:18px}
.bal b{font:800 46px/1 "Baloo 2",sans-serif;display:flex;align-items:center;gap:6px}
.bal.r b{color:var(--r)}
.bal.ok b{color:var(--ok)}
.bal .ic{width:38px;height:38px;stroke-width:3}
.bal small{width:100%;color:var(--mu);font-size:15px}
.msec{border-top:2px dashed var(--line);padding-top:10px;margin-top:18px}
.msec h3{font-size:26px;margin:6px 0 4px}
details>summary{cursor:pointer;font:800 22px "Baloo 2",sans-serif;min-height:50px;display:flex;align-items:center;gap:10px;list-style:none}
details>summary::-webkit-details-marker{display:none}
details>summary::after{content:"+";margin-left:auto;width:36px;height:36px;border-radius:50%;background:var(--g2);display:grid;place-items:center;font-size:24px;color:var(--ink)}
details[open]>summary::after{content:"–"}
.ml{list-style:none;margin:0;padding:0}
.ml li{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line)}
.ml li>div{flex:1 1 200px;display:flex;align-items:center;gap:10px}
.ml li>div>span{display:block}
.ml small{display:block;color:var(--mu);font-size:14px;font-weight:600}
.ml li input{flex:1 1 160px;width:auto}
.rec{white-space:pre-wrap;background:var(--bg);border-radius:16px;padding:12px 14px;font:15px/1.5 Nunito,sans-serif;margin:6px 0;border:2px dashed var(--line)}
.row{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.tgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr));gap:18px;align-items:start}
.thd{display:flex;align-items:center;gap:12px}
.thd .tic{width:52px;height:52px;border-radius:16px}
.thd .tic .ic{width:30px;height:30px}
.thd>div{flex:1}
.tname{font:800 26px "Baloo 2",sans-serif}
.say{background:var(--y2);border-radius:14px;padding:12px 16px;margin:14px 0 0;font-weight:600}
.stp{display:flex;align-items:stretch;border:2px solid var(--line);border-radius:999px;overflow:hidden;width:max-content;max-width:100%;background:var(--bg)}
.stp button{all:unset;width:54px;min-height:54px;display:grid;place-items:center;cursor:pointer;background:var(--g2)}
.stp button:hover{background:color-mix(in srgb,var(--g2) 70%,var(--g))}
.stp button:focus-visible{outline:3px solid var(--g);outline-offset:-3px}
.stp input{width:76px;border:0;border-radius:0;text-align:center;font:800 24px "Baloo 2",sans-serif;min-height:54px;background:transparent}
.teams{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,200px),1fr));gap:10px;margin:8px 0 14px}
.team{border-radius:16px;padding:10px 12px;background:var(--bg);border:2px solid var(--line)}
.team.inc{border-style:dashed;background:transparent}
.teamh{display:flex;justify-content:space-between;align-items:center;gap:8px;font:800 17px/1.2 "Baloo 2",sans-serif;margin-bottom:4px}
.team ul{list-style:none;margin:0;padding:0;font-size:15px}
.team li{display:flex;align-items:center;gap:8px;padding:3px 0}
.team li .lnk{flex:1}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.dot.ok{background:var(--ok)}
.dot.am{background:#e5a400}
.dot.r{background:var(--r)}
.dot.mu{background:var(--line)}
.lnk{all:unset;cursor:pointer;font-weight:700;text-decoration:underline;text-decoration-color:var(--line);text-decoration-thickness:2px;text-underline-offset:3px}
.lnk:hover{text-decoration-color:var(--g)}
.lnk:focus-visible{outline:2px solid var(--g)}
.chip{display:inline-block;font-size:13px;font-weight:800;padding:2px 10px;border-radius:99px;white-space:nowrap}
.chip.ok{background:var(--okb);color:var(--ok)}
.chip.r{background:var(--rb);color:var(--r)}
.chip.am{background:var(--amb);color:var(--am)}
.chip.mu{background:var(--g2);color:var(--mu)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:14px;color:var(--mu);font-weight:600;margin:4px 0}
.legend span{display:inline-flex;align-items:center;gap:6px}
.mets{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.met{display:inline-flex;align-items:center;gap:2px;background:var(--g2);border-radius:99px;padding:2px 4px 2px 14px;font-weight:700}
.met .x{width:36px;height:36px;background:transparent}
.ask{max-width:440px;padding:24px}
.ask p{font:800 22px/1.25 "Baloo 2",sans-serif;margin:0 0 14px}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--gd);color:#fff;padding:8px 8px 8px 20px;border-radius:999px;opacity:0;transition:opacity .2s,transform .2s;z-index:30;max-width:calc(100% - 32px);pointer-events:none;display:flex;align-items:center;gap:12px;min-height:52px;font-weight:700;box-shadow:0 10px 30px -10px #000a}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast.act{pointer-events:auto}
.toast button{all:unset;cursor:pointer;color:#fff;background:var(--crim);font-weight:800;padding:8px 16px;border-radius:999px}
.toast button:focus-visible{outline:2px solid #fff}
@media (prefers-reduced-motion:reduce){.toast,.btn,.tile,.pc{transition:none}.okc,.conf i{animation:none}.conf{display:none}}
@media(max-width:900px){.topg{grid-template-columns:minmax(0,1fr)}}
@media(max-width:700px){
.ttl .logo img{height:64px}
body{padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
.tabs{position:fixed;top:auto;bottom:0;left:0;right:0;padding:0 6px env(safe-area-inset-bottom,0px)}
.tabs .wrap{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}
.tabs a{flex-direction:column;justify-content:center;gap:0;font-size:14px;padding:6px 2px;min-height:62px;text-align:center;border-radius:16px}
.tabs .ic{width:24px;height:24px}
.toast{bottom:calc(88px + env(safe-area-inset-bottom,0px))}
.score{gap:6px}
.k{padding:10px 12px;border-radius:14px}
.k span{font-size:13px}
.k small{font-size:12.5px}
.two,.tiles.three{grid-template-columns:minmax(0,1fr)}
.ov{padding:0}
.sheet{border-radius:0;min-height:100%;padding:0 16px 24px}
.lhead .btn{width:100%}
.wnav .btn{flex:1}
.price{font-size:24px}
}
</style>
</head>

const T=id=>S.torneos.find(t=>t.id===id);
const P=id=>S.personas.find(p=>p.id===id);
const cuota=t=>t?r2(t.cobro==='equipo'?t.precio/Math.max(1,t.jugadores):t.precio):0;
function stat(p){const ins=S.inscripciones.filter(i=>i.p===p.id),pg=S.pagos.filter(x=>x.p===p.id).sort((a,b)=>a.f-b.f);const debe=r2(ins.reduce((a,i)=>a+cuota(T(i.t)),0)),pago=r2(pg.reduce((a,x)=>a+(+x.usd||0),0)),saldo=r2(debe-pago);const est=!ins.length?(pago?'favor':'sin'):saldo<=0?(saldo<0?'favor':'ok'):pago>0?'parcial':'debe';return{ins,pg,debe,pago,saldo,est}}
const EST={ok:['Pagado','ok'],favor:['A favor','ok'],parcial:['Pagó una parte','am'],debe:['No ha pagado','r'],sin:['Sin torneo','mu']};
const chip=e=>`<span class="chip ${EST[e][1]}">${EST[e][0]}</span>`;
function teams(t){const m=new Map();for(const i of S.inscripciones.filter(i=>i.t===t.id)){const k=t.jugadores>1?norm(i.eq):'';if(!m.has(k))m.set(k,{name:k?clean(i.eq):'',ms:[]});m.get(k).ms.push(i)}return m}
function eqCount(t){const ins=S.inscripciones.filter(i=>i.t===t.id);if(t.jugadores<=1)return ins.length;let n=0;for(const [k,v] of teams(t))n+=k?1:Math.ceil(v.ms.length/t.jugadores);return n}
const openTeams=t=>[...teams(t).entries()].filter(([k,v])=>k&&v.ms.length<t.jugadores).map(([k,v])=>v);
const findP=n=>{const k=norm(n);return k?S.personas.find(p=>norm(p.nombre)===k):null};
const digits=v=>String(v||'').replace(/\D/g,'');
function telIntl(p){const t=String(p.tel||'').trim();if(!t)return '';if(t.startsWith('+'))return '+'+digits(t);if(t.startsWith('00'))return '+'+digits(t).slice(2);return '+'+(p.cc||'58')+digits(t).replace(/^0+/,'')}
const telShow=p=>{const t=String(p.tel||'').trim();if(!t)return '';return t.startsWith('+')||t.startsWith('00')?t:'+'+(p.cc||'58')+' '+t.replace(/^0+/,'')};

const tile=(label,act,data,on,extra)=>`<button type="button" class="tile${on?' on':''}${extra?' '+extra:''}" data-act="${act}" ${Object.entries(data).map(([k,v])=>`data-${k}="${esc(v)}"`).join(' ')} aria-pressed="${!!on}">${on?ic('check'):''}<span>${label}</span></button>`;

function buildDoc(){const d=new DOMParser().parseFromString(SRC,'text/html');d.documentElement.removeAttribute('data-theme');d.querySelectorAll('head>:not([data-own]),body>:not([data-own])').forEach(n=>n.remove());d.getElementById('db').textContent=JSON.stringify(S).replace(/</g,'\\u003c');return '<!DOCTYPE html>\n'+d.documentElement.outerHTML}

function save(msg,prev){ui.undo=prev||null;if(mode==='art'){if(ro){toast('Solo puedes ver: este enlace no permite guardar.');return}ui.toast=msg||null;saveUi();clearTimeout(timer);timer=setTimeout(pub,300);syncMsg='Guardando…'}else if(mode==='wait'){pending=true;saveUi()}else{storeLocal();saveUi()}if(msg)toast(msg,!!prev);render()}

$('#kRec').textContent=usd(rec);$('#kRecN').textContent=S.pagos.length+(S.pagos.length===1?' pago':' pagos');
$('#kCob').textContent=usd(cob);$('#kCobN').textContent=deb.length?deb.length+(deb.length===1?' persona debe':' personas deben'):'Nadie debe';

$('#kJug').textContent=jug;$('#kJugN').textContent=jug?st.filter(s=>s.est==='ok'||s.est==='favor').length+' pagaron todo'+(ex?` · ${ex} de afuera`:''):'Nadie aún';
$('#kTor').innerHTML=S.torneos.filter(t=>t.estado!=='cerrado').map(t=>{const n=eqCount(t),c=+t.cupos||0,p=c?Math.min(100,n/c*100):0;return `<div class="cu">${ic(tIcon(t))}<span>${esc(t.nombre)}</span><div class="tr"><i style="width:${p}%"></i></div><span class="v">${n}${c?' de '+c:''} ${t.jugadores>1?'equipos':'jugadores'}</span></div>`}).join('')}

<div id="pl"></div>${cashHtml()}`}
function rowsLista(){const q=norm(ui.q);let rows=S.personas.map(p=>({p,s:stat(p)}));
if(q)rows=rows.filter(({p,s})=>norm([p.nombre,p.curso,p.inst,p.tel,...s.ins.map(i=>i.eq),...s.pg.map(x=>x.ref)].join(' ')).includes(q));

$('#pl').innerHTML=rows.length?`<div class="pl">${rows.map(({p,s})=>{const id=esc(p.id);return `<article class="pc"><button class="pmain" data-open="${id}">${av(p)}<span class="pn">${esc(p.nombre)}</span><span class="ps">${esc(proc(p))}</span><span class="pts">${s.ins.map(i=>{const t=T(i.t),solo=t&&t.jugadores>1&&!i.eq;return `<span class="tc${solo?' solo':''}">${ic(tIcon(t))}${esc(t?.nombre||'—')}${t&&t.jugadores>1?` <i>${solo?'sin dúo':esc(i.eq)}</i>`:''}</span>`}).join('')}</span></button><div class="pr">${s.saldo>0?`<span class="amt ${s.pago>0?'am':'r'}">Debe ${usd(s.saldo)}</span><button class="btn pri sm" data-open="${id}" data-pay="1">${ic('wallet')} Cobrar</button>`:s.ins.length?`<span class="amt ok">${ic('check')} Pagado</span>`:`<span class="amt">Sin torneo</span>`}</div></article>`}).join('')}</div>`:`<div class="panel empty">${S.personas.length?'No hay nadie con ese filtro.':ic('ball')+'<br>Todavía no hay inscritos.<br><br><a class="btn pri lg" href="#inscribir">Inscribir al primero</a>'}</div>`}

const payUsd=st=>{const m=+st.monto||0;return r2(st.mon==='Bs'?((+st.tasa||0)>0?m/st.tasa:0):m)};

<span class="lbl">¿Estudia en este colegio?</span><div class="tiles two">${tile('Sí, es del colegio','wSet',{k:'ext',v:'0'},!w.ext)}${tile('No, viene de afuera','wSet',{k:'ext',v:'1'},w.ext)}</div>
${w.ext?`<label for="wInst">¿De qué colegio o lugar viene? <span class="mu">(opcional)</span></label><input id="wInst" data-w="inst" value="${esc(w.inst)}">`:`<label for="wCurso">Año y sección <span class="mu">(opcional)</span></label><input id="wCurso" data-w="curso" value="${esc(w.curso)}" placeholder="Ej: 4to B">`}

<div class="wnav"><button class="btn pri lg" data-act="wNext">Siguiente ${ic('right')}</button></div></div>`}

case 'close':closeP();break;
case 'helpOk':ui.help=false;try{localStorage.setItem('help-'+KEY,'no')}catch(err){}saveUi();render();break;
case 'helpShow':ui.help=true;try{localStorage.removeItem('help-'+KEY)}catch(err){}saveUi();location.hash='#inscritos';break;
case 'fil':ui[b.dataset.k]=b.dataset.v;saveUi();render();break;
case 'wSet':{const k=b.dataset.k;let v=b.dataset.v;if(k==='ext'){v=v==='1';w.extSet=true}w[k]=v;if(k==='pago'&&v==='si'&&!w.monto&&wDue().total>0){}saveUi();render();break}
case 'wTor':{const t=T(id),cur=w.t[id];if(cur&&cur.on)cur.on=false;else w.t[id]=Object.assign({mode:t.jugadores>1?'':'luego',eq:''},cur||{},{on:true});wErr(2,'');saveUi();render();break}
case 'wMode':{const t=w.t[id];if(t){if(t.mode!==b.dataset.v)t.eq='';t.mode=b.dataset.v}saveUi();render();const f=$('#wEq-'+CSS.escape(id));if(f)f.focus();break}
case 'wTeam':{const t=w.t[id];if(t){t.eq=b.dataset.v;t.mode='unir'}saveUi();render();break}
case 'wNext':if(wValid(w.step)){if(w.step===1){const d=findP(w.nombre);if(d&&!w.extSet){w.ext=d.ext}}w.step=Math.min(3,w.step+1);if(w.step===3&&!w.monto){const du=wDue().total;if(du>0&&w.mon==='USD')w.monto=String(du)}saveUi();render();window.scrollTo({top:0})}break;
case 'wBack':w.step=Math.max(1,w.step-1);saveUi();render();window.scrollTo({top:0});break;
case 'wSave':if(wValid(3))wSave();break;
case 'doneMate':{const of=ui.done.offer;ui.wiz=W0();ui.wiz.t[of.t]={on:true,mode:'unir',eq:of.eq};ui.done=null;saveUi();render();$('#wNombre').focus();break}
case 'doneNew':ui.done=null;ui.wiz=W0();saveUi();render();$('#wNombre').focus();break;
case 'doneOpen':openP(ui.done.p);break;
case 'paySet':{const st=ps(b.dataset.pf),k=b.dataset.k;const was=st.mon;st[k]=b.dataset.v;if(k==='mon'&&was!==st.mon&&+st.monto){const tz=+st.tasa||0;if(st.mon==='Bs'&&tz)st.monto=String(r2(st.monto*tz));else if(st.mon==='USD'&&tz)st.monto=String(r2(st.monto/tz));else st.monto=''}saveUi();render();break}
case 'fillDue':{const pf=b.dataset.pf,st=ps(pf),due=dueOf(pf);if(st.mon==='Bs'&&!(+st.tasa>0)){const f=$('#'+pf+'-tasa');if(f)f.focus();toast('Primero escribe a cuánto está el dólar.');break}st.monto=String(st.mon==='Bs'?r2(due*st.tasa):due);const f=$('#'+pf+'-monto');if(f)f.value=st.monto;saveUi();updPay(pf);break}
case 'savePay':{const st=ui.mp,err=m=>{$('#eM').textContent=m};if(!(+st.monto>0)){err('Escribe cuánto entregó.');$('#m-monto').focus();break}if(st.mon==='Bs'&&!(+st.tasa>0)){err('Escribe a cuánto está el dólar hoy.');break}if(!st.met){err('Elige cómo pagó.');break}const u=payUsd(st);S.pagos.push({id:uid(),p:ui.sel,monto:r2(st.monto),mon:st.mon,tasa:st.mon==='Bs'?+st.tasa:0,usd:u,met:st.met,ref:st.ref.trim(),f:Date.now()});if(st.mon==='Bs')S.config.tasa=+st.tasa;ui.mp=M0();save(`Pago de ${usd(u)} guardado.`);break}
case 'pSet':{const p=P(id);if(p){p.ext=b.dataset.v==='1';save('Guardado.')}break}
case 'delIns':{const i=S.inscripciones.find(x=>x.id===id);if(i){const prev=snap();S.inscripciones=S.inscripciones.filter(x=>x.id!==id);save(`Quitado de ${T(i.t)?.nombre||'el torneo'}.`,prev)}break}
case 'delPago':{const prev=snap();S.pagos=S.pagos.filter(x=>x.id!==id);save('Pago borrado.',prev);break}
case 'delPer':{const p=P(id);if(p&&await ask(`¿Eliminar a ${p.nombre} con sus inscripciones y pagos?`,`Sí, eliminar a ${p.nombre}`)){const prev=snap();S.personas=S.personas.filter(x=>x.id!==id);S.inscripciones=S.inscripciones.filter(i=>i.p!==id);S.pagos=S.pagos.filter(x=>x.p!==id);ui.sel=null;save(`${p.nombre} eliminado.`,prev)}break}
case 'wipe':if(await ask('¿Borrar TODAS las inscripciones y pagos? Los torneos se quedan. Si no tienes una copia de seguridad, no se podrá recuperar.','Sí, borrar todo')){const prev=snap();S.personas=[];S.inscripciones=[];S.pagos=[];ui.sel=null;save('Inscripciones borradas.',prev)}break;
case 'copyRec':try{await navigator.clipboard.writeText(recibo(P(ui.sel)));toast('Comprobante copiado. Pégalo donde quieras.')}catch(err){toast('No se pudo copiar: selecciona el texto y cópialo.')}break;
case 'addTorneo':S.torneos.push({id:uid(),nombre:'Nuevo torneo',juego:'',jugadores:2,precio:0,cobro:'jugador',cupos:16,estado:'proximamente'});save('Torneo agregado al final.');break;
case 'tSet':{const t=T(id);if(t){t[b.dataset.k]=b.dataset.v;save('Guardado.')}break}
case 'tStep':{const t=T(id),k=b.dataset.k;if(t){const mn=k==='jugadores'?1:0,mx=k==='jugadores'?6:999;t[k]=Math.min(mx,Math.max(mn,(+t[k]||0)+(+b.dataset.d)));save()}break}
case 'delTorneo':{const t=T(id),n=S.inscripciones.filter(i=>i.t===id).length;if(t&&await ask(`¿Eliminar ${t.nombre}${n?` y sacar a sus ${n} inscritos`:''}? Los pagos se quedan guardados.`,`Sí, eliminar ${t.nombre}`)){const prev=snap();S.torneos=S.torneos.filter(x=>x.id!==id);S.inscripciones=S.inscripciones.filter(i=>i.t!==id);if(ui.ft===id)ui.ft='';save(`${t.nombre} eliminado.`,prev)}break}
case 'delMet':{const prev=snap();S.config.metodos.splice(+b.dataset.i,1);save('Forma de pago quitada.',prev);break}
case 'csv':dl(`inscripciones-${stamp()}.csv`,csv());break;
case 'json':dl(`copia-inscripciones-${stamp()}.json`,JSON.stringify(S,null,1));break}});

document.addEventListener('submit',e=>{e.preventDefault();const f=e.target;
if(f.id==='fIns'){const t=T($('#iT').value);if(!t)return;S.inscripciones.push({id:uid(),p:ui.sel,t:t.id,eq:'',f:Date.now()});save(`Agregado a ${t.nombre}.`)}
else if(f.id==='fMet'){const v=clean($('#mNew').value);if(v&&!S.config.metodos.includes(v)){S.config.metodos.push(v);save('Forma de pago agregada.')}}});

document.addEventListener('input',e=>{const el=e.target,w=ui.wiz;
if(el.dataset.w){w[el.dataset.w]=el.value;saveUi();if(el.id==='wNombre'){const d=findP(w.nombre);$('#wDup').textContent=d?`${d.nombre} ya está registrado. Lo que hagas ahora se suma a su ficha.`:'';wErr(1,'')}}
else if(el.dataset.wt){const o=w.t[el.dataset.wt];if(o){o.eq=el.value;saveUi();const t=T(el.dataset.wt),h=$('#wH-'+CSS.escape(el.dataset.wt)),ex=t&&teams(t).get(norm(el.value));if(h&&ex){h.textContent=ex.ms.length>=t.jugadores?'Ese nombre ya existe y el equipo está completo. Usa otro.':'Ese equipo ya existe: se unirá a '+ex.ms.map(i=>P(i.p)?.nombre||'').join(', ')+'.';h.className='hint '+(ex.ms.length>=t.jugadores?'bad':'good')}}}
else if(el.dataset.pf){const st=ps(el.dataset.pf);st[el.dataset.pk]=el.value;saveUi();updPay(el.dataset.pf)}
else if(el.id==='q'){ui.q=el.value;saveUi();rowsLista()}});

document.addEventListener('change',e=>{const el=e.target;
if(el.id==='imp'&&el.files[0]){el.files[0].text().then(async tx=>{let d;try{d=JSON.parse(tx)}catch(err){}if(!d||!Array.isArray(d.personas)||!Array.isArray(d.torneos)){toast('Ese archivo no es una copia de seguridad válida.');return}if(await ask(`¿Reemplazar todo lo de aquí con esa copia (${d.personas.length} inscritos, ${d.torneos.length} torneos)?`,'Sí, recuperar copia')){const prev=snap();S=d;fix();ui.sel=null;save('Copia recuperada.',prev)}});return}
const ty=el.dataset.e,k=el.dataset.k;if(!ty)return;const obj=ty==='t'?T(el.dataset.id):ty==='p'?P(el.dataset.id):ty==='i'?S.inscripciones.find(i=>i.id===el.dataset.id):S.config;if(!obj)return;
let v=el.value;if(['jugadores','precio','cupos','tasa'].includes(k)){v=Math.max(0,+v||0);if(k==='jugadores')v=Math.min(6,Math.max(1,Math.round(v)));if(k==='cupos')v=Math.round(v)}else v=k==='cc'?v:clean(v);
if((k==='nombre'||k==='evento')&&!v){render();return}obj[k]=v;save('Guardado.')});

document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('.wiz input')){e.preventDefault();const b=$('.wnav [data-act=wNext],.wnav [data-act=wSave]');if(b)b.click();return}if(e.key==='Escape'){if(!$('#ask').hidden)$('#askNo').click();else if(ui.sel)closeP()}});

route();render();
if(ui.toast){toast(ui.toast,!!ui.undo);ui.toast=null;saveUi()}
if(hasC){window.claude.use('artifact').then(a=>{if(a){art=a;mode='art';if(pending)pub()}else{mode='local';if(pending)storeLocal();else loadLocal()}pending=false;render()});window.claude.use('downloads').then(d=>{dlNs=d})}
}
</script>
</body>
